id: duplicacy_backup_validation
namespace: automation.infrastructure

description: |
  Starts the Duplicacy validation service on the configured backup server, waits for
  all ten snapshot checks and two test-file retrievals, and reports the result.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: run_backup_validation
    type: io.kestra.plugin.scripts.python.Script
    description: Start or adopt a validation run and poll it to completion.
    timeout: PT8H
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      VALIDATION_API_URL: "{{ envs.backup_validation_url }}"
      VALIDATION_API_USERNAME: "{{ envs.backup_validation_username }}"
      VALIDATION_API_PASSWORD: "{{ envs.backup_validation_password }}"
    script: |
      import base64
      import json
      import os
      import time
      import urllib.error
      import urllib.parse
      import urllib.request

      API_URL = os.environ["VALIDATION_API_URL"].rstrip("/")
      USERNAME = os.environ["VALIDATION_API_USERNAME"]
      PASSWORD = os.environ["VALIDATION_API_PASSWORD"]
      POLL_SECONDS = 30
      MAX_WAIT_SECONDS = (7 * 60 * 60) + (45 * 60)

      if not API_URL.startswith("https://"):
          raise ValueError("Backup validation API URL must use HTTPS")
      if not USERNAME or not PASSWORD:
          raise ValueError("Backup validation API credentials are not configured")

      authorization = base64.b64encode(
          f"{USERNAME}:{PASSWORD}".encode("utf-8")
      ).decode("ascii")
      headers = {
          "Accept": "application/json",
          "Authorization": f"Basic {authorization}",
          "User-Agent": "Kestra-Duplicacy-Validator/1.0",
      }

      def request_json(url, method="GET"):
          for attempt in range(1, 6):
              request = urllib.request.Request(
                  url,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = json.load(response)
                      return response.status, payload
              except urllib.error.HTTPError as error:
                  try:
                      payload = json.loads(
                          error.read().decode("utf-8", errors="replace")
                      )
                  except json.JSONDecodeError:
                      payload = {"detail": f"HTTP {error.code}"}
                  return error.code, payload
              except urllib.error.URLError as error:
                  if attempt == 5:
                      raise RuntimeError(
                          "Backup validation API request failed after five "
                          f"attempts: {error.reason}"
                      ) from error
                  delay = min(5 * (2 ** (attempt - 1)), 60)
                  print(
                      f"Validation API request attempt {attempt}/5 failed: "
                      f"{error.reason}; retrying in {delay}s"
                  )
                  time.sleep(delay)

      status_code, started = request_json(API_URL, method="POST")
      if status_code == 202:
          run_id = str(started.get("run_id") or "")
          print(f"Started Duplicacy validation run {run_id}")
      elif status_code == 409:
          detail = started.get("detail") or {}
          if not isinstance(detail, dict):
              raise RuntimeError(
                  f"Validation API returned an unusable conflict: {started}"
              )
          run_id = str(detail.get("run_id") or "")
          print(f"Adopting already-running Duplicacy validation {run_id}")
      else:
          raise RuntimeError(
              f"Validation API rejected the start request: "
              f"HTTP {status_code}: {started}"
          )

      if not run_id:
          raise RuntimeError("Validation API did not return a run ID")

      status_url = f"{API_URL}/{urllib.parse.quote(run_id, safe='')}"
      deadline = time.monotonic() + MAX_WAIT_SECONDS
      previous_progress = None

      while True:
          if time.monotonic() >= deadline:
              raise TimeoutError(
                  f"Validation {run_id} did not finish within "
                  f"{MAX_WAIT_SECONDS // 60} minutes"
              )

          status_code, validation = request_json(status_url)
          if status_code != 200:
              raise RuntimeError(
                  f"Unable to read validation {run_id}: "
                  f"HTTP {status_code}: {validation}"
              )

          run_status = str(validation.get("status") or "")
          results = validation.get("results") or []
          passed_so_far = sum(
              1 for result in results if result.get("passed") is True
          )
          failed_so_far = sum(
              1 for result in results if result.get("passed") is False
          )
          progress = (
              run_status,
              len(results),
              passed_so_far,
              failed_so_far,
          )
          if progress != previous_progress:
              print(
                  f"Validation {run_id}: status={run_status}, "
                  f"completed_checks={len(results)}/12, "
                  f"passed={passed_so_far}, failed={failed_so_far}"
              )
              previous_progress = progress

          if run_status in {"queued", "running"}:
              time.sleep(POLL_SECONDS)
              continue
          if run_status not in {"passed", "failed"}:
              raise RuntimeError(
                  f"Validation {run_id} returned unknown status {run_status!r}"
              )

          summary = validation.get("summary") or {}
          failed_results = [
              result
              for result in results
              if not bool(result.get("passed"))
          ]
          if (
              run_status != "passed"
              or validation.get("passed") is not True
              or failed_results
          ):
              failure_labels = []
              for result in failed_results:
                  failure_labels.append(
                      f"{result.get('storage', 'unknown')}:"
                      f"{result.get('source', 'unknown')}"
                  )
              detail = ", ".join(failure_labels) or validation.get(
                  "error", "unknown validation failure"
              )
              raise RuntimeError(
                  f"Duplicacy validation {run_id} failed: {detail}"
              )

          expected = {
              "total": 12,
              "passed": 12,
              "failed": 0,
              "snapshot_checks": 10,
              "content_checks": 2,
          }
          for key, expected_value in expected.items():
              if summary.get(key) != expected_value:
                  raise RuntimeError(
                      f"Validation {run_id} returned an incomplete summary: "
                      f"{summary}"
                  )

          output = {
              "outputs": {
                  "run_id": run_id,
                  "status": run_status,
                  "started_at": validation.get("started_at"),
                  "finished_at": validation.get("finished_at"),
                  "total_checks": summary["total"],
                  "snapshot_checks": summary["snapshot_checks"],
                  "content_checks": summary["content_checks"],
              }
          }
          print("::" + json.dumps(output, separators=(",", ":")) + "::")
          break

  - id: send_success
    type: io.kestra.plugin.email.MailSend
    from: "{{ envs.consulting_email }}"
    to: "{{ envs.consulting_email }}"
    subject: >-
      Duplicacy backup validation passed —
      {{ outputs.run_backup_validation.vars.finished_at }}
    plainTextContent: |
      Both Duplicacy backup storages passed validation.

      API run: {{ outputs.run_backup_validation.vars.run_id }}
      Snapshot checks: {{ outputs.run_backup_validation.vars.snapshot_checks }}
      Content checks: {{ outputs.run_backup_validation.vars.content_checks }}
      Total successful checks: {{ outputs.run_backup_validation.vars.total_checks }}
      Started: {{ outputs.run_backup_validation.vars.started_at }}
      Finished: {{ outputs.run_backup_validation.vars.finished_at }}
      Kestra execution: {{ execution.id }}

triggers:
  - id: weekly_validation
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * SUN"
    timezone: Australia/Brisbane
    allowConcurrent: false

pluginDefaults:
  - type: io.kestra.plugin.email.MailSend
    values:
      host: "{{ envs.smtp_host }}"
      port: "{{ envs.smtp_port }}"
      username: "{{ envs.smtp_username }}"
      password: "{{ envs.smtp_password }}"
      transportStrategy: SMTP_TLS
      sessionTimeout: 30000
      verifyServerIdentity: true

errors:
  - id: send_failure
    type: io.kestra.plugin.email.MailSend
    from: "{{ envs.consulting_email }}"
    to: "{{ envs.consulting_email }}"
    subject: "FAILED: Duplicacy backup validation — {{ execution.id }}"
    plainTextContent: |
      The Duplicacy backup validation failed or timed out.

      API: {{ envs.backup_validation_url }}
      Kestra execution: {{ execution.id }}
      Started: {{ execution.startDate }}

      Check the run_backup_validation task log for the API run ID and failed
      storage/source checks. The validation service attempts every check before
      returning a failed result.
